<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO Application</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/1492c0ca81.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-wrapper container d-flex flex-column justify-content-center align-items-center py-5 min-vh-100">
        <div class="todo-card p-5 w-100 shadow-lg rounded-4 bg-white" style="max-width: 650px;">
            <h1 class="text-center fw-bold mb-4 gradient-text">TODO APPLICATION</h1>

            <div class="input-group mb-4 gap-2 shadow-sm rounded-pill p-1 border">
                <textarea id="userIn" class="form-control rounded-pill px-4 border-0 shadow-none focus-ring-0"
                    placeholder="What needs to be done?" rows="1"></textarea>
                <button onclick="onAddTodo()" class="btn btn-primary rounded-pill px-4 fw-semibold custom-add-btn">
                    <i class="fa-solid fa-plus me-2"></i>ADD
                </button>
            </div>

            <p id="msg" class="text-danger fw-medium text-center"></p>

            <div class="task-list-container mt-4">
                <h4 class="mb-4 fw-semibold text-secondary">Your Tasks</h4>
                <ul style="list-style: none; padding: 0;" id="root"></ul>
            </div>

            <div class="text-center mt-5">
                <button class="btn btn-success rounded-pill px-5 py-2 fw-bold shadow save-btn w-100"
                    onclick="onSaveTodo()">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Save List
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header border-0 bg-light rounded-top-4">
                    <h5 class="modal-title fw-bold text-dark" id="editModalLabel">Edit Task</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <textarea id="editTaskInput" class="form-control form-control-lg rounded-3 border-secondary-subtle"
                        placeholder="Edit your task..." rows="2"></textarea>
                    <p id="editMsg" class="text-danger mt-2 mb-0" style="display: none; font-size: 0.9rem;"></p>
                </div>
                <div class="modal-footer border-0 pb-4 px-4 bg-white rounded-bottom-4">
                    <button type="button" class="btn btn-light rounded-pill px-4 me-2 border"
                        data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4 custom-save-btn"
                        onclick="saveEditedTodo()">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Save Confirmation Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="saveToast" class="toast align-items-center text-bg-success border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body fw-semibold">
                    Todo list saved successfully!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>

</html>
