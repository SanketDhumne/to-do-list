<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO Application</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://kit.fontawesome.com/1492c0ca81.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="d-flex flex-column justify-content-center align-items-center p-5">
        <h1 class="text-primary"> TODO APPLICATION </h1>

        <br>

        <input id="userIn" type="text" class="form-control w-75 border-primary" placeholder="Enter your task .... ">
        <br><br>
        <button onclick="onAddTodo()" class="btn btn-outline-primary">ADD</button>

        <br>
        <p id="msg"></p>
        <br><br>
        <div class="w-75">
            <h3> List your task </h3>
            <br>
            <ul style="list-style: none;" id="root"></ul>

        </div>

        <br />

        <button class="btn btn-success" onclick="onSaveTodo()">Save</button>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script src="index.js"></script>
</body>

</html>
